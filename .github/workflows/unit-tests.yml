name: Integration tests

on:
  push:
    branches:
      - master
      - main
      - v1.0-dev
    paths:
      - "Gemfile"
      - "Gemfile.lock"
      - "_config.yml"
      - "_data/**"
      - "_pages/**"
      - "_posts/**"
      - "_projects/**"
      - "_project_notes/**"
      - "_extra/**"
      - "_includes/**"
      - ".al-folio-overrides.yml"
      - "assets/**"
      - "test/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/unit-tests.yml"
  pull_request:
    branches:
      - master
      - main
      - v1.0-dev
    paths:
      - "Gemfile"
      - "Gemfile.lock"
      - "_config.yml"
      - "_data/**"
      - "_pages/**"
      - "_posts/**"
      - "_projects/**"
      - "_project_notes/**"
      - "_extra/**"
      - "_includes/**"
      - ".al-folio-overrides.yml"
      - "assets/**"
      - "test/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/unit-tests.yml"

jobs:
  personal-site-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup Ruby 💎
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.5"
          bundler-cache: true

      - name: Setup Python 🐍
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Setup Node 🧰
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install JS deps 📦
        run: npm ci

      - name: Run style contract lint 🧷
        run: npm run lint:style-contract

      - name: Install build prerequisites 🔧
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          pip3 install --upgrade nbconvert

      # Upstream demo tests depend on sample posts removed from this personal site.
      # Build the actual site and verify its navigation, content links and assets.
      - name: Build and check personal site
        run: |
          JEKYLL_ENV=production bundle exec jekyll build --destination /tmp/personal-site-check
          python3 test/check_personal_site.py /tmp/personal-site-check

      - name: Audit local theme overrides
        run: bundle exec al-folio upgrade overrides audit
